services:
  - type: web
    runtime: static
    name: mapa-musical-cordoba
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/mapa-musical-cordoba/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
    # SPA: todas las rutas sirven index.html (para el router de Angular)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
